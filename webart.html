<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>ArtPlay Mobile AR</title>

  <!-- AFRAME FIRST -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR SECOND -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

    :root{
      --bg:#0e0e0e;
      --gold:#b8924a;
      --gold2:#d4ad72;
      --text:#f2ede4;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:'DM Mono', monospace;
    }

    body{
      position:fixed;
      inset:0;
    }

    #landing{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:2rem;
      text-align:center;
      background:var(--bg);
    }

    .logo{
      font-family:'Cormorant Garamond', serif;
      font-size:clamp(3rem,10vw,5rem);
      letter-spacing:.15em;
      font-weight:300;
    }

    .logo span{
      color:var(--gold);
      font-style:italic;
    }

    .sub{
      margin-top:.5rem;
      margin-bottom:3rem;
      font-size:.7rem;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:rgba(255,255,255,.4);
    }

    #startBtn{
      background:transparent;
      border:1px solid var(--gold);
      color:var(--gold);
      padding:1rem 2rem;
      font-size:.7rem;
      letter-spacing:.2em;
      text-transform:uppercase;
      cursor:pointer;
    }

    #status{
      margin-top:1.5rem;
      font-size:.7rem;
      color:rgba(255,255,255,.65);
      line-height:1.6;
      max-width:300px;
    }

    #ar-wrapper{
      position:fixed;
      inset:0;
      display:none;
      z-index:1;
      background:black;
    }

    #arScene{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      transition:opacity .4s;
    }

    #hud{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:50;
      display:flex;
      justify-content:space-between;
      padding:1rem;
      background:linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
      pointer-events:none;
    }

    #hudTitle{
      font-family:'Cormorant Garamond', serif;
      color:var(--gold2);
      font-size:1rem;
    }

    #hudStatus{
      font-size:.6rem;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:rgba(255,255,255,.7);
    }

    #scanBox{
      position:fixed;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      pointer-events:none;
      z-index:40;
    }

    .scanFrame{
      width:min(70vw,300px);
      height:min(70vw,300px);
      border:2px solid var(--gold);
    }

    #videoPlayer{
      position:fixed;
      inset:0;
      background:black;
      z-index:200;
      display:none;
      align-items:center;
      justify-content:center;
    }

    #videoPlayer.active{
      display:flex;
    }

    #fullscreenVideo{
      width:100%;
      height:100%;
      object-fit:contain;
      background:black;
    }

    #videoTop{
      position:absolute;
      top:0;
      left:0;
      right:0;
      padding:1rem;
      background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    }

    #videoTitle{
      font-family:'Cormorant Garamond', serif;
      font-size:1.3rem;
    }

    #videoMeta{
      margin-top:.2rem;
      font-size:.65rem;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:var(--gold);
    }

    #videoBottom{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      padding:1rem;
      display:flex;
      justify-content:space-between;
      background:linear-gradient(to top, rgba(0,0,0,.75), transparent);
    }

    .btn{
      background:transparent;
      border:1px solid var(--gold);
      color:var(--gold);
      padding:.8rem 1rem;
      font-size:.65rem;
      letter-spacing:.15em;
      text-transform:uppercase;
      cursor:pointer;
    }

    /* HIDE AFRAME VR BUTTONS */

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-fullscreen {
      display:none !important;
    }

  </style>
</head>

<body>

<!-- LANDING -->

<div id="landing">

  <div class="logo">
    Art<span>Play</span>
  </div>

  <div class="sub">
    Mobile AR Experience
  </div>

  <button id="startBtn">
    Enter Gallery
  </button>

  <div id="status">
    Ready
  </div>

</div>

<!-- AR -->

<div id="ar-wrapper">

  <div id="hud">
    <div id="hudTitle">ArtPlay</div>
    <div id="hudStatus">Scanning</div>
  </div>

  <div id="scanBox">
    <div class="scanFrame"></div>
  </div>

  <a-scene
    id="arScene"
    embedded
    color-space="sRGB"
    renderer="colorManagement:true; physicallyCorrectLights:false;"
    vr-mode-ui="enabled:false"
    xr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:true"
    mindar-image="
      imageTargetSrc:https://rodriged.github.io/ArtViewer/targets.mind;
      autoStart:false;
      uiLoading:no;
      uiScanning:no;
      uiError:no;
      maxTrack:1;
      warmupTolerance:5;
      missTolerance:5;
    "
  >

    <a-assets>

      <video
        id="video0"
        src="https://rodriged.github.io/ArtViewer/Lion-a.mp4"
        preload="auto"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
      ></video>

      <video
        id="video1"
        src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4"
        preload="auto"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
      ></video>

      <video
        id="video2"
        src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4"
        preload="auto"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
      ></video>

      <video
        id="video3"
        src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4"
        preload="auto"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
      ></video>

      <video
        id="video4"
        src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4"
        preload="auto"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
      ></video>

    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="target1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="target2" mindar-image-target="targetIndex:2"></a-entity>
    <a-entity id="target3" mindar-image-target="targetIndex:3"></a-entity>
    <a-entity id="target4" mindar-image-target="targetIndex:4"></a-entity>

  </a-scene>

</div>

<!-- VIDEO -->

<div id="videoPlayer">

  <video
    id="fullscreenVideo"
    playsinline
    webkit-playsinline
    loop
  ></video>

  <div id="videoTop">
    <div id="videoTitle"></div>
    <div id="videoMeta"></div>
  </div>

  <div id="videoBottom">

    <button class="btn" onclick="backToScan()">
      Scan Another
    </button>

    <button class="btn" onclick="closeAR()">
      Exit
    </button>

  </div>

</div>

<script>

const artworks = [
  { title:"Artwork Lion", artist:"Sue", year:"2026" },
  { title:"Artwork Flaming Peacock", artist:"Sue", year:"2026" },
  { title:"Artwork Spanish Dancer", artist:"Sue", year:"2026" },
  { title:"Artwork Indian Dancer", artist:"Sue", year:"2026" },
  { title:"Artwork Whale", artist:"Sue", year:"2026" }
];

/* =====================================================
   DOM
===================================================== */

const landing       = document.getElementById("landing");
const arWrapper     = document.getElementById("ar-wrapper");
const arScene       = document.getElementById("arScene");
const startBtn      = document.getElementById("startBtn");
const statusText    = document.getElementById("status");

const videoPlayer   = document.getElementById("videoPlayer");
const fullscreenVid = document.getElementById("fullscreenVideo");

const videoTitle    = document.getElementById("videoTitle");
const videoMeta     = document.getElementById("videoMeta");

/* =====================================================
   GLOBALS
===================================================== */

let mindarSystem = null;
let listenersAttached = false;

/* =====================================================
   DEBUG
===================================================== */

console.log("AFRAME:", window.AFRAME);
console.log("MINDAR:", window.MINDAR);
console.log("Secure:", window.isSecureContext);

console.log(
  "mediaDevices:",
  !!navigator.mediaDevices
);

console.log(
  "getUserMedia:",
  !!navigator.mediaDevices?.getUserMedia
);

/* =====================================================
   PRELOAD VIDEOS
===================================================== */

document.querySelectorAll("video").forEach(v => {
  v.load();
});

/* =====================================================
   START BUTTON
===================================================== */

startBtn.addEventListener("click", startAR);

/* =====================================================
   START AR
===================================================== */

async function startAR() {

  try {

    statusText.innerHTML =
      "Requesting camera permission...";

    /* FORCE CAMERA PERMISSION FIRST */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

    stream.getTracks().forEach(track => {
      track.stop();
    });

  } catch (err) {

    console.error(err);

    alert(
      "Camera permission denied.\n\n" +
      "Please allow camera access."
    );

    return;
  }

  landing.style.display = "none";

  arWrapper.style.display = "block";

  /* IMPORTANT */
  arScene.style.opacity = "1";

  statusText.innerHTML =
    "Initializing AR...";

  /* WAIT FOR AFRAME SYSTEMS */

  await waitForMindAR();

  if (!mindarSystem) {

    alert(
      "MindAR failed to initialize.\n\n" +
      "Check:\n" +
      "1. HTTPS enabled\n" +
      "2. targets.mind exists\n" +
      "3. Phone browser supports WebRTC"
    );

    return;
  }

  try {

    console.log("Starting MindAR");

    await mindarSystem.start();

    console.log("MindAR started");

    attachListeners();

  } catch (err) {

    console.error(err);

    alert(
      "Failed to start AR camera.\n\n" +
      "See console logs."
    );
  }
}

/* =====================================================
   WAIT FOR SYSTEM
===================================================== */

async function waitForMindAR() {

  return new Promise(resolve => {

    let attempts = 0;

    const timer = setInterval(() => {

      attempts++;

      console.log(
        "Checking systems:",
        Object.keys(arScene.systems)
      );

      mindarSystem =
        arScene.systems["mindar-image-system"] ||
        arScene.systems["mindar-image"];

      if (mindarSystem) {

        console.log(
          "MindAR system found"
        );

        clearInterval(timer);

        resolve();

      }

      if (attempts > 50) {

        console.error(
          "MindAR timeout"
        );

        clearInterval(timer);

        resolve();
      }

    }, 200);

  });
}

/* =====================================================
   TARGET LISTENERS
===================================================== */

function attachListeners() {

  if (listenersAttached) return;

  listenersAttached = true;

  artworks.forEach((art, i) => {

    const target =
      document.getElementById(
        "target" + i
      );

    if (!target) return;

    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "TARGET FOUND:",
          i
        );

        showVideo(i);

      }
    );

  });
}

/* =====================================================
   SHOW VIDEO
===================================================== */

async function showVideo(i) {

  const art = artworks[i];

  const src =
    document
      .getElementById("video" + i)
      ?.getAttribute("src");

  if (!src) return;

  try {

    await mindarSystem.stop();

  } catch (e) {}

  arWrapper.style.display = "none";

  videoPlayer.classList.add(
    "active"
  );

  fullscreenVid.src = src;

  fullscreenVid.currentTime = 0;

  videoTitle.textContent =
    art.title;

  videoMeta.textContent =
    `${art.artist} · ${art.year}`;

  try {

    await fullscreenVid.play();

  } catch (e) {

    console.warn(e);

  }

  try {

    if (
      fullscreenVid.requestFullscreen
    ) {

      await fullscreenVid
        .requestFullscreen();

    }

  } catch (e) {}
}

/* =====================================================
   BACK TO SCAN
===================================================== */

async function backToScan() {

  fullscreenVid.pause();

  fullscreenVid.src = "";

  videoPlayer.classList.remove(
    "active"
  );

  try {

    if (
      document.fullscreenElement
    ) {

      await document.exitFullscreen();

    }

  } catch (e) {}

  arWrapper.style.display = "block";

  try {

    await mindarSystem.start();

  } catch (e) {

    console.warn(e);

  }
}

/* =====================================================
   CLOSE
===================================================== */

async function closeAR() {

  try {

    await mindarSystem.stop();

  } catch (e) {}

  fullscreenVid.pause();

  fullscreenVid.src = "";

  videoPlayer.classList.remove(
    "active"
  );

  arWrapper.style.display = "none";

  landing.style.display = "flex";
}

console.log("ArtPlay loaded");

</script>

</body>
</html>
