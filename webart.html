<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>ArtPlay — Multi Artwork AR</title>

  <!-- A-Frame FIRST -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

    :root {
      --ink: #0e0e0e;
      --parchment: #f2ede4;
      --gold: #b8924a;
      --gold-light: #d4ad72;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--ink);
      color: var(--parchment);
      height: 100dvh;
      overflow: hidden;
    }

    #landing {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--ink);
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
    }

    .wordmark span {
      color: var(--gold);
      font-style: italic;
    }

    .sub {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(242,237,228,0.4);
      margin-bottom: 3rem;
    }

    #artCount {
      margin-bottom: 2rem;
      color: var(--gold-light);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
    }

    #startBtn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 1rem 2.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #ar-wrapper {
      display: none;
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }

    .hud-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--gold-light);
    }

    #statusPill {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(242,237,228,0.6);
    }

    #scanFrame {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .frame-box {
      width: min(65vw, 280px);
      height: min(65vw, 280px);
      border: 2px solid var(--gold);
    }

    #closeBtn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 80;
      display: none;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    /* FULLSCREEN VIDEO */

    #videoPlayer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: black;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #videoPlayer.active {
      display: flex;
    }

    #fullscreenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #videoOverlayTop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }

    #videoOverlayTitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
    }

    #videoOverlayMeta {
      font-size: 0.6rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #videoOverlayBottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    #backToScanBtn,
    #exitBtn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="landing">
  <p class="wordmark">Art<span>Play</span></p>
  <p class="sub">Augmented Experience</p>

  <div id="artCount"></div>

  <button id="startBtn" onclick="startAR()">
    Enter the Gallery
  </button>
</div>

<div id="ar-wrapper">

  <div id="hud">
    <span class="hud-brand">ArtPlay</span>
    <span id="statusPill">Scanning gallery…</span>
  </div>

  <div id="scanFrame">
    <div class="frame-box"></div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: https://rodriged.github.io/ArtViewer/targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      maxTrack: 1;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none"
  >

    <a-assets>

      <!-- Videos -->

      <video
        id="video0"
        src="https://rodriged.github.io/ArtViewer/Lion-a.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="video1"
        src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="video2"
        src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="video3"
        src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="video4"
        src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <!-- Targets -->

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-plane
        width="1"
        height="0.552"
        material="color: #111; opacity: 0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1">
      <a-plane
        width="1"
        height="0.552"
        material="color: #111; opacity: 0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target2" mindar-image-target="targetIndex: 2">
      <a-plane
        width="1"
        height="0.552"
        material="color: #111; opacity: 0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target3" mindar-image-target="targetIndex: 3">
      <a-plane
        width="1"
        height="0.552"
        material="color: #111; opacity: 0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target4" mindar-image-target="targetIndex: 4">
      <a-plane
        width="1"
        height="0.552"
        material="color: #111; opacity: 0.01">
      </a-plane>
    </a-entity>

  </a-scene>

</div>

<!-- FULLSCREEN VIDEO -->

<div id="videoPlayer">

  <video
    id="fullscreenVideo"
    playsinline
    webkit-playsinline
    loop>
  </video>

  <div id="videoOverlayTop">
    <div id="videoOverlayTitle"></div>
    <div id="videoOverlayMeta"></div>
  </div>

  <div id="videoOverlayBottom">
    <button id="backToScanBtn" onclick="backToScan()">
      Scan Another
    </button>

    <button id="exitBtn" onclick="closeAR()">
      Exit
    </button>
  </div>

</div>

<button id="closeBtn" onclick="closeAR()">✕</button>

<script>

const artworks = [
  { title: "Artwork One", artist: "Artist", year: "2024" },
  { title: "Artwork Two", artist: "Artist", year: "2023" },
  { title: "Artwork Three", artist: "Artist", year: "2022" },
  { title: "Artwork Four", artist: "Artist", year: "2021" },
  { title: "Artwork Five", artist: "Artist", year: "2020" }
];

/* DOM */

const landing = document.getElementById('landing');
const arWrapper = document.getElementById('ar-wrapper');
const arScene = document.getElementById('arScene');
const closeBtn = document.getElementById('closeBtn');

const videoPlayer = document.getElementById('videoPlayer');
const fullscreenVideo = document.getElementById('fullscreenVideo');

const videoOverlayTitle =
  document.getElementById('videoOverlayTitle');

const videoOverlayMeta =
  document.getElementById('videoOverlayMeta');

document.getElementById('artCount').textContent =
  artworks.length + ' artworks registered';

/* Preload videos */

document.querySelectorAll('video').forEach(v => {
  v.load();
});

let listenersAttached = false;

/* START AR */

async function startAR() {

  landing.style.display = 'none';
  arWrapper.style.display = 'block';
  closeBtn.style.display = 'block';
  arScene.style.display = 'block';

  if (arScene.hasLoaded) {
    attachListeners();
  } else {
    arScene.addEventListener(
      'loaded',
      attachListeners,
      { once: true }
    );
  }

  await new Promise(r => setTimeout(r, 500));

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  if (!mindar) {
    console.error("MindAR system not found");
    return;
  }

  try {
    await mindar.start();
    console.log("✅ MindAR started");
  } catch (err) {
    console.error("❌ MindAR start failed", err);
  }
}

/* LISTENERS */

function attachListeners() {

  if (listenersAttached) return;

  listenersAttached = true;

  artworks.forEach((art, i) => {

    const entity =
      document.getElementById('target' + i);

    if (!entity) return;

    entity.addEventListener('targetFound', () => {
      console.log('🎯 target found', i);
      showFullscreenVideo(i);
    });

  });

}

/* SHOW VIDEO */

async function showFullscreenVideo(i) {

  const art = artworks[i];

  const src =
    document.getElementById('video' + i)
      ?.getAttribute('src');

  if (!src) return;

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  if (mindar && typeof mindar.stop === "function") {
    await mindar.stop();
  }

  arWrapper.style.display = 'none';
  closeBtn.style.display = 'none';

  videoPlayer.classList.add('active');

  fullscreenVideo.src = src;
  fullscreenVideo.currentTime = 0;

  try {
    await fullscreenVideo.play();
  } catch (err) {
    console.warn('play blocked', err);
  }

  videoOverlayTitle.textContent = art.title;

  videoOverlayMeta.textContent =
    `${art.artist} · ${art.year}`;

  try {
    if (fullscreenVideo.requestFullscreen) {
      await fullscreenVideo.requestFullscreen();
    }
  } catch (e) {}
}

/* BACK TO SCAN */

async function backToScan() {

  fullscreenVideo.pause();
  fullscreenVideo.src = '';

  videoPlayer.classList.remove('active');

  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }
  } catch (e) {}

  arWrapper.style.display = 'block';
  closeBtn.style.display = 'block';

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  if (mindar && typeof mindar.start === "function") {
    await mindar.start();
  }
}

/* CLOSE */

async function closeAR() {

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  if (mindar && typeof mindar.stop === "function") {
    await mindar.stop();
  }

  fullscreenVideo.pause();
  fullscreenVideo.src = '';

  videoPlayer.classList.remove('active');

  arWrapper.style.display = 'none';
  closeBtn.style.display = 'none';

  landing.style.display = 'flex';
}

console.log("✅ ArtPlay loaded");

</script>

</body>
</html>
