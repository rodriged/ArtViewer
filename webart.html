<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>ArtPlay — Mobile AR Gallery</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

    :root {
      --ink: #0e0e0e;
      --gold: #b8924a;
      --gold-light: #d4ad72;
      --paper: #f2ede4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: 'DM Mono', monospace;
      color: var(--paper);
    }

    #landing {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      background: var(--ink);
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 10vw, 5rem);
      letter-spacing: 0.15em;
      font-weight: 300;
    }

    .wordmark span {
      color: var(--gold);
      font-style: italic;
    }

    .sub {
      margin-top: 0.5rem;
      margin-bottom: 3rem;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    #startBtn {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 1rem 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #status {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
    }

    #ar-wrapper {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      pointer-events: none;
    }

    #hudTitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--gold-light);
    }

    #hudStatus {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    #scanBox {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }

    .scan-frame {
      width: min(70vw, 300px);
      height: min(70vw, 300px);
      border: 2px solid var(--gold);
    }

    #videoPlayer {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: black;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #videoPlayer.active {
      display: flex;
    }

    #fullscreenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #videoTop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }

    #videoTitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
    }

    #videoMeta {
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #videoBottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      display: flex;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    .videoBtn {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 0.8rem 1rem;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #closeBtn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color: white;
      display: none;
      cursor: pointer;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="landing">

  <div class="wordmark">
    Art<span>Play</span>
  </div>

  <div class="sub">
    Mobile Web AR Gallery
  </div>

  <button id="startBtn">
    Enter Gallery
  </button>

  <div id="status">
    Waiting to start...
  </div>

</div>

<div id="ar-wrapper">

  <div id="hud">
    <div id="hudTitle">ArtPlay</div>
    <div id="hudStatus">Scanning...</div>
  </div>

  <div id="scanBox">
    <div class="scan-frame"></div>
  </div>

  <a-scene
    embedded
    id="arScene"
    mindar-image="
      imageTargetSrc: https://rodriged.github.io/ArtViewer/targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      maxTrack: 1;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="colorManagement: true; precision: medium;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    style="display:none"
  >

    <a-assets>

      <!-- Videos -->

      <video
        id="video0"
        src="https://rodriged.github.io/ArtViewer/Lion-a.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop>
      </video>

      <video
        id="video1"
        src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop>
      </video>

      <video
        id="video2"
        src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop>
      </video>

      <video
        id="video3"
        src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop>
      </video>

      <video
        id="video4"
        src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        loop>
      </video>

    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <!-- Invisible targets -->

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-plane width="1" height="0.552"
        material="color:#111; opacity:0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1">
      <a-plane width="1" height="0.552"
        material="color:#111; opacity:0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target2" mindar-image-target="targetIndex: 2">
      <a-plane width="1" height="0.552"
        material="color:#111; opacity:0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target3" mindar-image-target="targetIndex: 3">
      <a-plane width="1" height="0.552"
        material="color:#111; opacity:0.01">
      </a-plane>
    </a-entity>

    <a-entity id="target4" mindar-image-target="targetIndex: 4">
      <a-plane width="1" height="0.552"
        material="color:#111; opacity:0.01">
      </a-plane>
    </a-entity>

  </a-scene>

</div>

<!-- Fullscreen video -->

<div id="videoPlayer">

  <video
    id="fullscreenVideo"
    playsinline
    webkit-playsinline
    loop>
  </video>

  <div id="videoTop">
    <div id="videoTitle"></div>
    <div id="videoMeta"></div>
  </div>

  <div id="videoBottom">

    <button class="videoBtn" onclick="backToScan()">
      Scan Another
    </button>

    <button class="videoBtn" onclick="closeAR()">
      Exit
    </button>

  </div>

</div>

<button id="closeBtn" onclick="closeAR()">✕</button>

<script>

/* =========================================================
   ARTWORKS
========================================================= */

const artworks = [
  {
    title: "Artwork One",
    artist: "Artist",
    year: "2024"
  },
  {
    title: "Artwork Two",
    artist: "Artist",
    year: "2023"
  },
  {
    title: "Artwork Three",
    artist: "Artist",
    year: "2022"
  },
  {
    title: "Artwork Four",
    artist: "Artist",
    year: "2021"
  },
  {
    title: "Artwork Five",
    artist: "Artist",
    year: "2020"
  }
];

/* =========================================================
   DOM
========================================================= */

const landing = document.getElementById('landing');
const arWrapper = document.getElementById('ar-wrapper');
const arScene = document.getElementById('arScene');
const startBtn = document.getElementById('startBtn');
const statusText = document.getElementById('status');
const closeBtn = document.getElementById('closeBtn');

const videoPlayer = document.getElementById('videoPlayer');
const fullscreenVideo = document.getElementById('fullscreenVideo');
const videoTitle = document.getElementById('videoTitle');
const videoMeta = document.getElementById('videoMeta');

/* =========================================================
   DEBUG
========================================================= */

console.log("mediaDevices:", !!navigator.mediaDevices);
console.log("getUserMedia:", !!navigator.mediaDevices?.getUserMedia);
console.log("Secure Context:", window.isSecureContext);

/* =========================================================
   PRELOAD VIDEOS
========================================================= */

document.querySelectorAll('video').forEach(v => {
  v.load();
});

/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener('click', startAR);

/* =========================================================
   START AR
========================================================= */

async function startAR() {

  statusText.innerHTML = "Requesting camera permission...";

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

    stream.getTracks().forEach(track => {
      track.stop();
    });

  } catch (err) {

    console.error(err);

    alert(
      "Camera permission denied.\n\n" +
      "Please allow camera access."
    );

    return;
  }

  landing.style.display = 'none';

  arWrapper.style.display = 'block';

  closeBtn.style.display = 'block';

  arScene.style.display = 'block';

  await new Promise(r => setTimeout(r, 1200));

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  if (!mindar) {

    console.error("MindAR system missing");

    alert("MindAR failed to initialize.");

    return;
  }

  try {

    await mindar.start();

    console.log("MindAR started");

  } catch (err) {

    console.error(err);

    alert(
      "Unable to start camera.\n\n" +
      "Make sure you are using HTTPS."
    );

    return;
  }

  attachTargetListeners();
}

/* =========================================================
   TARGET LISTENERS
========================================================= */

let listenersAttached = false;

function attachTargetListeners() {

  if (listenersAttached) return;

  listenersAttached = true;

  artworks.forEach((art, i) => {

    const entity =
      document.getElementById("target" + i);

    if (!entity) return;

    entity.addEventListener("targetFound", () => {

      console.log("TARGET FOUND:", i);

      showVideo(i);

    });

  });
}

/* =========================================================
   SHOW VIDEO
========================================================= */

async function showVideo(i) {

  const art = artworks[i];

  const src =
    document.getElementById("video" + i)
      ?.getAttribute("src");

  if (!src) return;

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  try {

    if (mindar) {
      await mindar.stop();
    }

  } catch (e) {
    console.warn(e);
  }

  arWrapper.style.display = 'none';

  closeBtn.style.display = 'none';

  videoPlayer.classList.add('active');

  fullscreenVideo.src = src;

  fullscreenVideo.currentTime = 0;

  videoTitle.textContent = art.title;

  videoMeta.textContent =
    `${art.artist} · ${art.year}`;

  try {

    await fullscreenVideo.play();

  } catch (err) {

    console.warn("Autoplay blocked:", err);

  }

  try {

    if (fullscreenVideo.requestFullscreen) {

      await fullscreenVideo.requestFullscreen();

    }

  } catch (e) {}
}

/* =========================================================
   BACK TO SCAN
========================================================= */

async function backToScan() {

  fullscreenVideo.pause();

  fullscreenVideo.src = '';

  videoPlayer.classList.remove('active');

  try {

    if (document.fullscreenElement) {

      await document.exitFullscreen();

    }

  } catch (e) {}

  arWrapper.style.display = 'block';

  closeBtn.style.display = 'block';

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  try {

    if (mindar) {

      await mindar.start();

    }

  } catch (e) {

    console.warn(e);

  }
}

/* =========================================================
   CLOSE
========================================================= */

async function closeAR() {

  const mindar =
    arScene.systems["mindar-image-system"] ||
    arScene.systems["mindar-image"];

  try {

    if (mindar) {

      await mindar.stop();

    }

  } catch (e) {}

  fullscreenVideo.pause();

  fullscreenVideo.src = '';

  videoPlayer.classList.remove('active');

  arWrapper.style.display = 'none';

  closeBtn.style.display = 'none';

  landing.style.display = 'flex';
}

console.log("ArtPlay loaded");

</script>

</body>
</html>
