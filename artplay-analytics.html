<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>ArtPlay AR Analytics</title>

<!-- A-Frame MUST come before MindAR -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://gstatic.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

:root { --bg:#0e0e0e; --gold:#b8924a; --gold2:#d4ad72; --text:#f2ede4; }

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:black; color:var(--text); font-family:'DM Mono',monospace; }
body { position:fixed; inset:0; }

/* ── Kill ALL A-Frame built-in UI ── */
.a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-enter-ar-button,
.a-orientation-modal, [aframe-injected], .a-loader-title,
.a-dialog, .a-dialog-allow-button, .a-dialog-deny-button, .a-dialog-ok-button {
  display:none !important; visibility:hidden !important;
  pointer-events:none !important; opacity:0 !important;
}

/* ── LANDING ── */
#landing { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; background:#0e0e0e; }
.logo { font-family:'Cormorant Garamond',serif; font-size:clamp(3rem,10vw,5rem); letter-spacing:.15em; font-weight:300; }
.logo span { color:var(--gold); font-style:italic; }
.sub { margin-top:.6rem; margin-bottom:2rem; font-size:.7rem; letter-spacing:.35em; text-transform:uppercase; color:rgba(255,255,255,.45); }
#startBtn { background:transparent; border:1px solid var(--gold); color:var(--gold); padding:1rem 2rem; font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:all .2s; }
#startBtn:hover { background:var(--gold); color:#000; }
#statusText { margin-top:1.5rem; max-width:320px; line-height:1.7; font-size:.7rem; color:rgba(255,255,255,.65); min-height:1.5em; }

/* ── AR WRAPPER ── */
#ar-wrapper { position:fixed; inset:0; display:none; background:black; }
#arScene { position:fixed; inset:0; width:100%; height:100%; }

/* ── HUD ── */
#hud { position:fixed; top:0; left:0; right:0; z-index:50; padding:1rem; display:flex; justify-content:space-between; background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent); pointer-events:none; }
#hudTitle { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--gold2); }
#hudStatus { font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.7); transition:color .3s; }
#hudStatus.found { color:var(--gold); }

/* ── SCAN BOX ── */
#scanBox { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:40; pointer-events:none; transition:opacity .4s; }
.scanFrame { width:min(70vw,300px); height:min(70vw,300px); position:relative; }
.corner { position:absolute; width:24px; height:24px; border-color:var(--gold); border-style:solid; }
.corner.tl { top:0; left:0; border-width:2px 0 0 2px; }
.corner.tr { top:0; right:0; border-width:2px 2px 0 0; }
.corner.bl { bottom:0; left:0; border-width:0 0 2px 2px; }
.corner.br { bottom:0; right:0; border-width:0 2px 2px 0; }
.scanLine { position:absolute; left:0; right:0; height:1px; background:linear-gradient(to right,transparent,var(--gold2),transparent); animation:scanAnim 2.5s ease-in-out infinite; }
@keyframes scanAnim { 0%{top:0;opacity:0} 5%{opacity:1} 95%{opacity:1} 100%{top:100%;opacity:0} }
.scanHint { margin-top:1.5rem; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(242,237,228,.35); }

/* ── VIDEO PLAYER ── */
#videoPlayer { position:fixed; inset:0; z-index:200; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; }
#videoPlayer.active { display:flex; }
#fullscreenVideo {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; background:#000;
  /* GPU layer — fixes Android blank/line bug */
  transform:translateZ(0); -webkit-transform:translateZ(0);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
#videoTop { position:absolute; top:0; left:0; right:0; padding:1rem; background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent); pointer-events:none; }
#videoTitle { font-family:'Cormorant Garamond',serif; font-size:1.3rem; }
#videoMeta { margin-top:.2rem; font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--gold); }
#videoBottom { position:absolute; bottom:0; left:0; right:0; padding:1rem; display:flex; justify-content:space-between; gap:1rem; background:linear-gradient(to top,rgba(0,0,0,.75),transparent); }
.btn { background:transparent; border:1px solid var(--gold); color:var(--gold); padding:.8rem 1rem; font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; cursor:pointer; transition:all .2s; font-family:'DM Mono',monospace; }
.btn:hover { background:var(--gold); color:#000; }
.btn.secondary { border-color:rgba(242,237,228,.3); color:rgba(242,237,228,.6); }
.btn.secondary:hover { border-color:var(--text); color:var(--text); background:transparent; }

/* ── ANALYTICS PANEL ── */
#analyticsPanel { position:fixed; bottom:12px; left:12px; z-index:500; background:rgba(0,0,0,.7); color:white; padding:10px 14px; border-radius:10px; font-size:11px; line-height:1.9; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08); }
#analyticsPanel .label { color:var(--gold2); }
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="logo">Art<span>Play</span></div>
  <div class="sub">Augmented Reality Gallery</div>
  <button id="startBtn">Enter Gallery</button>
  <div id="statusText">Ready</div>
</div>

<!-- AR -->
<div id="ar-wrapper">
  <div id="hud">
    <div id="hudTitle">ArtPlay</div>
    <div id="hudStatus">Scanning…</div>
  </div>
  <div id="scanBox">
    <div class="scanFrame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanLine"></div>
    </div>
    <div class="scanHint">Point at an artwork</div>
  </div>

  <!--
  ══════════════════════════════════════════════════════
  UPDATE THESE:
  1. imageTargetSrc → your hosted targets.mind URL
  2. <video> src attrs → your hosted .mp4 URLs
  3. artworks[] array in the script → your titles/artists/years
  ══════════════════════════════════════════════════════
  -->
  <a-scene
    id="arScene"
    embedded
    color-space="sRGB"
    renderer="colorManagement:true; physicallyCorrectLights:false;"
    vr-mode-ui="enabled:false"
    ar-mode-ui="enabled:false"
    xr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    mindar-image="
      imageTargetSrc:https://rodriged.github.io/ArtViewer/targets.mind;
      autoStart:false;
      uiLoading:no;
      uiScanning:no;
      uiError:no;
      maxTrack:1;
      warmupTolerance:2;
      missTolerance:10;
    "
  >
    <a-assets>
      <!-- Videos — no crossorigin (causes Android CORS range-request failures) -->
      <video id="video0" src="https://rodriged.github.io/ArtViewer/Lion-a.mp4"            preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video1" src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4"    preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video2" src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video3" src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4"      preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video4" src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4"       preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- No visible planes — detection only, video plays fullscreen -->
    <a-entity id="target0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="target1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="target2" mindar-image-target="targetIndex:2"></a-entity>
    <a-entity id="target3" mindar-image-target="targetIndex:3"></a-entity>
    <a-entity id="target4" mindar-image-target="targetIndex:4"></a-entity>
  </a-scene>
</div>

<!-- VIDEO PLAYER -->
<div id="videoPlayer">
  <video id="fullscreenVideo" playsinline webkit-playsinline loop muted></video>
  <div id="videoTop">
    <div id="videoTitle"></div>
    <div id="videoMeta"></div>
  </div>
  <div id="videoBottom">
    <button class="btn" onclick="backToScan()">⟵ Scan Another</button>
    <button class="btn secondary" onclick="exitApp()">✕ Exit</button>
  </div>
</div>

<!-- ANALYTICS PANEL -->
<div id="analyticsPanel">
  <div><span class="label">Daily Users: </span><span id="dailyUsers">…</span></div>
  <div><span class="label">Total Visits: </span><span id="totalVisits">…</span></div>
  <div><span class="label">Location: </span><span id="userLocation">…</span></div>
</div>

<script>
/* ══════════════════════════════════════════
   FIREBASE — update with your own config
══════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyBLgVzIThthvr0fQJR9vF2PLozE7AlCJlw",
  authDomain:        "artplayweb-e4839.firebaseapp.com",
  projectId:         "artplayweb-e4839",
  storageBucket:     "artplayweb-e4839.firebasestorage.app",
  messagingSenderId: "163947790614",
  appId:             "1:163947790614:web:0e8bca2b7e1fe848d91037",
  measurementId:     "G-G3G5DC3TZM"
};
firebase.initializeApp(firebaseConfig);
const analytics = firebase.analytics(); 
const db = firebase.firestore();

/* ══════════════════════════════════════════
   ARTWORKS — update titles/artists/years
   ORDER must match targets.mind upload order
══════════════════════════════════════════ */
const artworks = [
  { title:"Artwork: Lion", artist:"Sue Siva", year:"2026" },
  { title:"Artwork: Flaming Peacock", artist:"Sue Siva", year:"2026" },
  { title:"Artwork: Spanish Dancer", artist:"Sue Siva", year:"2026" },
  { title:"Artwork: Indian Dancer", artist:"Sue Siva", year:"2026" },
  { title:"Artwork: Whale", artist:"Sue Siva", year:"2026" },
];

/* ══════════════════════════════════════════
   DOM
══════════════════════════════════════════ */
const landing        = document.getElementById("landing");
const arWrapper      = document.getElementById("ar-wrapper");
const arScene        = document.getElementById("arScene");
const statusText     = document.getElementById("statusText");
const hudStatus      = document.getElementById("hudStatus");
const scanBox        = document.getElementById("scanBox");
const videoPlayer    = document.getElementById("videoPlayer");
const fullscreenVid  = document.getElementById("fullscreenVideo");
const videoTitle     = document.getElementById("videoTitle");
const videoMeta      = document.getElementById("videoMeta");

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let mindarSystem      = null;
let listenersAttached = false;
let videoLaunching    = false;
let activeIndex       = -1;

/* ══════════════════════════════════════════
   KILL A-FRAME VR BUTTON (MutationObserver)
══════════════════════════════════════════ */
(function killVRButton() {
  const selectors = [
    '.a-enter-vr', '.a-enter-ar',
    '.a-enter-vr-button', '.a-enter-ar-button',
    '.a-orientation-modal', '[aframe-injected]'
  ];
  function remove() {
    selectors.forEach(s =>
      document.querySelectorAll(s).forEach(el => el.remove())
    );
  }
  remove();
  new MutationObserver(remove)
    .observe(document.body, { childList:true, subtree:true });
})();

/* ══════════════════════════════════════════
   ANALYTICS
══════════════════════════════════════════ */
window.addEventListener("load", initAnalytics);

/* ═══════════════════════════════════════════════════
   LOCATION — 3-API fallback chain
   ipapi.co is often blocked on mobile browsers.
   We try three different free HTTPS services in order.
══════════════════════════════════════════════════ */
async function getLocation() {
  /* These APIs have open CORS headers — safe from GitHub Pages */
  const apis = [
    /* 1. ipapi.co with explicit CORS mode */
    async () => {
      const r = await fetch('https://ipapi.co/json/', { mode: 'cors' });
      const d = await r.json();
      if (d.city && d.region) return d.city + ', ' + d.region;
      throw new Error('ipapi failed');
    },
    /* 2. ip.seeip.org — open CORS, no key needed */
    async () => {
      const r = await fetch('https://ip.seeip.org/geoip');
      const d = await r.json();
      if (d.city && d.region) return d.city + ', ' + d.region;
      throw new Error('seeip failed');
    },
    /* 3. ipinfo.io — widely used, open CORS */
    async () => {
      const r = await fetch('https://ipinfo.io/json?token=');
      const d = await r.json();
      if (d.city && d.region) return d.city + ', ' + d.region;
      if (d.country) return 'Country: ' + d.country;
      throw new Error('ipinfo failed');
    },
    /* 4. Cloudflare trace — always works, returns country */
    async () => {
      const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
      const text = await r.text();
      const loc = Object.fromEntries(text.trim().split('\n').map(l => l.split('=')));
      if (loc.loc) return 'Country: ' + loc.loc;
      throw new Error('cloudflare failed');
    },
  ];
  for (const api of apis) {
    try {
      const result = await api();
      console.log('Location resolved:', result);
      return result;
    } catch(e) {
      console.warn('Location API failed, trying next:', e.message);
    }
  }
  return 'Unknown';
}

async function initAnalytics() {
  try {
    const today = new Date().toISOString().split('T')[0];
    let locationName = 'Unknown';

    /* Get location — multi-API fallback chain */
    try {
      locationName = await getLocation();
      document.getElementById('userLocation').textContent = locationName;
    } catch(e) {
      document.getElementById('userLocation').textContent = 'Unknown';
    }

    /* Increment daily users */
    const dailyRef = db.collection('dailyCounters').doc(today);
    await db.runTransaction(async tx => {
      const doc = await tx.get(dailyRef);
      if (!doc.exists) tx.set(dailyRef, { users:1 });
      else tx.update(dailyRef, { users: firebase.firestore.FieldValue.increment(1) });
    });

    /* Increment location counter */
    const locRef = db.collection('locationCounters').doc(locationName);
    await db.runTransaction(async tx => {
      const doc = await tx.get(locRef);
      if (!doc.exists) tx.set(locRef, { visits:1 });
      else tx.update(locRef, { visits: firebase.firestore.FieldValue.increment(1) });
    });

    /* Increment total visits */
    const totalRef = db.collection('global').doc('stats');
    await db.runTransaction(async tx => {
      const doc = await tx.get(totalRef);
      if (!doc.exists) tx.set(totalRef, { totalVisits:1 });
      else tx.update(totalRef, { totalVisits: firebase.firestore.FieldValue.increment(1) });
    });

    /* Read and display */
    const [dailySnap, totalSnap] = await Promise.all([
      dailyRef.get(), totalRef.get()
    ]);
    document.getElementById('dailyUsers').textContent  = dailySnap.data()?.users       || 0;
    document.getElementById('totalVisits').textContent = totalSnap.data()?.totalVisits  || 0;

  } catch(err) {
    console.error("Analytics error", err);
    document.getElementById('dailyUsers').textContent  = '–';
    document.getElementById('totalVisits').textContent = '–';
  }
}

/* ══════════════════════════════════════════
   WAIT FOR MINDAR SYSTEM
══════════════════════════════════════════ */
function waitForMindAR(timeout = 10000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const timer = setInterval(() => {
      const sys = arScene.systems["mindar-image-system"]
                || arScene.systems["mindar-image"];
      if (sys) {
        clearInterval(timer);
        mindarSystem = sys;
        resolve(sys);
      }
      if (Date.now() - start > timeout) {
        clearInterval(timer);
        reject(new Error("MindAR system not found"));
      }
    }, 100);
  });
}

/* ══════════════════════════════════════════
   START AR
══════════════════════════════════════════ */
document.getElementById("startBtn").addEventListener("click", startAR);

async function startAR() {
  statusText.textContent = "Requesting camera…";

  /* Pre-check camera permission */
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    stream.getTracks().forEach(t => t.stop());
  } catch(err) {
    alert("Camera permission denied. Please allow camera access and try again.");
    statusText.textContent = "Camera permission denied";
    return;
  }

  /* Show AR */
  landing.style.display   = "none";
  arWrapper.style.display = "block";
  listenersAttached       = false;

  statusText.textContent = "Starting AR…";

  try {
    await waitForMindAR();
    attachListeners();
    await mindarSystem.start();
    hudStatus.textContent = "Scanning…";
    console.log("✅ MindAR started");
  } catch(err) {
    console.error("MindAR start error:", err);
    alert("Failed to start AR. Please reload and try again.");
    landing.style.display   = "flex";
    arWrapper.style.display = "none";
  }
}

/* ══════════════════════════════════════════
   ATTACH TARGET LISTENERS
══════════════════════════════════════════ */
function attachListeners() {
  if (listenersAttached) return;
  listenersAttached = true;

  artworks.forEach((art, i) => {
    const target = document.getElementById("target" + i);
    if (!target) return;

    target.addEventListener("targetFound", () => {
      console.log("🎯 Target found — index:", i, "| artwork:", art.title, "| src:", document.getElementById("video"+i)?.getAttribute("src"));
      if (videoLaunching || activeIndex === i) return;
      activeIndex = i;
      hudStatus.textContent = art.title;
      hudStatus.classList.add("found");
      showVideo(i);
    });

    target.addEventListener("targetLost", () => {
      console.log("💨 Target lost:", i);
      /* Keep video playing after lost — user watches the full video */
    });
  });
}

/* ══════════════════════════════════════════
   SHOW FULLSCREEN VIDEO
══════════════════════════════════════════ */
async function showVideo(i) {
  if (videoLaunching) return;
  videoLaunching = true;

  const art = artworks[i];
  const src = document.getElementById("video" + i)?.getAttribute("src");
  if (!src) { videoLaunching = false; return; }

  /* Log to Firebase */
  try {
    await db.collection('artworkViews').add({
      artwork:   art.title,
      index:     i,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.warn("Analytics log failed:", e); }

  /* Pause MindAR — do NOT stop() as restart is unreliable */
  try { mindarSystem.pause(); } catch(e) {}

  /* Hide AR, show video */
  arWrapper.style.display = "none";
  scanBox.style.opacity   = "0";
  videoPlayer.classList.add("active");
  videoTitle.textContent  = art.title;
  videoMeta.textContent   = `${art.artist} · ${art.year}`;

  /* Reset video for Android stale decoder fix */
  fullscreenVid.pause();
  fullscreenVid.removeAttribute("src");
  fullscreenVid.load();
  fullscreenVid.muted = true;
  fullscreenVid.loop  = true;

  fullscreenVid.src = src;

  /* Wait for canplay before calling play() */
  const onCanPlay = () => {
    fullscreenVid.removeEventListener("canplay", onCanPlay);
    fullscreenVid.play()
      .then(() => { videoLaunching = false; })
      .catch(err => {
        console.warn("play() blocked:", err);
        fullscreenVid.muted = true;
        fullscreenVid.play()
          .then(() => { videoLaunching = false; })
          .catch(e => { console.error("play failed:", e); videoLaunching = false; });
      });
  };
  fullscreenVid.addEventListener("canplay", onCanPlay);
  fullscreenVid.load();

  /* Fallback if canplay never fires */
  setTimeout(() => {
    if (fullscreenVid.paused) {
      fullscreenVid.play().catch(() => {});
      videoLaunching = false;
    }
  }, 3000);

  /* iOS native fullscreen (skip on Android — causes blank screen) */
  if (!/android/i.test(navigator.userAgent)) {
    if (fullscreenVid.requestFullscreen)
      fullscreenVid.requestFullscreen().catch(() => {});
    else if (fullscreenVid.webkitRequestFullscreen)
      fullscreenVid.webkitRequestFullscreen();
  }
}

/* ══════════════════════════════════════════
   BACK TO SCAN
══════════════════════════════════════════ */
async function backToScan() {
  videoLaunching = false;
  activeIndex    = -1;

  /* Stop video */
  fullscreenVid.pause();
  fullscreenVid.src = "";
  videoPlayer.classList.remove("active");

  /* Exit fullscreen */
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  /* Resume MindAR */
  try { mindarSystem.unpause(); } catch(e) {}

  /* Show AR */
  arWrapper.style.display = "block";
  scanBox.style.opacity   = "1";
  hudStatus.textContent   = "Scanning…";
  hudStatus.classList.remove("found");
}

/* ══════════════════════════════════════════
   EXIT APP
══════════════════════════════════════════ */
async function exitApp() {
  videoLaunching = false;
  activeIndex    = -1;

  /* Immediately hide video player — prevents black flash */
  videoPlayer.style.display = "none";
  videoPlayer.classList.remove("active");
  fullscreenVid.pause();
  fullscreenVid.src = "";

  /* Exit fullscreen */
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  /* Stop MindAR */
  try { mindarSystem.stop(); } catch(e) {}

  /* Hide AR */
  arWrapper.style.display = "none";
  listenersAttached       = false;
  hudStatus.textContent   = "Scanning…";
  hudStatus.classList.remove("found");
  scanBox.style.opacity   = "1";

  /* Show landing after fullscreen collapses */
  setTimeout(() => {
    videoPlayer.style.display = "";
    landing.style.display     = "flex";
    statusText.textContent    = "Ready";
  }, 250);
}
</script>
</body>
</html>
