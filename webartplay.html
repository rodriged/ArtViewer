<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ArtPlay AR Stable</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: black;
  color: white;
}

#landing {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

button {
  padding: 1rem 2rem;
  font-size: 16px;
  cursor: pointer;
}

#ar-wrapper {
  display: none;
  position: fixed;
  inset: 0;
}

#arScene {
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 0.5s;
}

#status {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.7;
}

/* VIDEO */
#videoPlayer {
  position: fixed;
  inset: 0;
  display: none;
  background: black;
  z-index: 9999;
}

#videoPlayer.active {
  display: block;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
}

#bottom {
  position: absolute;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}
</style>

</head>

<body>

<!-- LANDING -->
<div id="landing">
  <h1>ArtPlay AR</h1>
  <button id="startBtn">Start AR</button>
  <div id="status">Ready</div>
</div>

<!-- AR -->
<div id="ar-wrapper">

  <a-scene
    id="arScene"
    embedded
    vr-mode-ui="enabled:false"
    mindar-image="imageTargetSrc:https://rodriged.github.io/ArtViewer/targets.mind; autoStart:false;"
  >

    <a-assets>
      <video id="video0" src="https://rodriged.github.io/ArtViewer/Lion-a.mp4" loop playsinline></video>
      <video id="video1" src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4" loop playsinline></video>
      <video id="video2" src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4" loop playsinline></video>
      <video id="video3" src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4" loop playsinline></video>
      <video id="video4" src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4" loop playsinline></video>
    </a-assets>

    <a-camera></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex:2"></a-entity>
    <a-entity id="t3" mindar-image-target="targetIndex:3"></a-entity>
    <a-entity id="t4" mindar-image-target="targetIndex:4"></a-entity>

  </a-scene>

</div>

<!-- VIDEO PLAYER -->
<div id="videoPlayer">

  <div id="hud">
    <div id="title"></div>
  </div>

  <video id="video" playsinline webkit-playsinline controls></video>

  <div id="bottom">
    <button onclick="backToScan()">Back</button>
    <button onclick="closeAR()">Exit</button>
  </div>

</div>

<script>

const startBtn = document.getElementById("startBtn");
const landing = document.getElementById("landing");
const arWrapper = document.getElementById("ar-wrapper");
const arScene = document.getElementById("arScene");
const statusText = document.getElementById("status");

const videoPlayer = document.getElementById("videoPlayer");
const video = document.getElementById("video");
const title = document.getElementById("title");

let mindarSystem = null;
let ready = false;

/* =========================
   SAFE START FLOW
========================= */

startBtn.onclick = async () => {

  statusText.textContent = "Initializing camera...";

  try {

    // 1. Show AR container FIRST (important for iOS)
    landing.style.display = "none";
    arWrapper.style.display = "block";

    // 2. Wait for A-Frame scene to be ready
    await waitForScene();

    // 3. Wait for MindAR system
    mindarSystem = arScene.systems["mindar-image-system"];

    if (!mindarSystem) {
      throw new Error("MindAR not ready");
    }

    // 4. Start AR (THIS is where camera activates)
    await mindarSystem.start();

    arScene.style.opacity = "1";

    attachTargets();

    statusText.textContent = "Camera active";

    ready = true;

  } catch (err) {

    console.error(err);
    alert("Failed to start AR / camera");

  }
};

/* =========================
   WAIT FOR SCENE
========================= */

function waitForScene() {
  return new Promise(resolve => {

    if (arScene.hasLoaded) {
      resolve();
      return;
    }

    arScene.addEventListener("loaded", () => {
      resolve();
    });

  });
}

/* =========================
   TARGETS
========================= */

function attachTargets() {

  const videos = document.querySelectorAll("video");

  for (let i = 0; i < 5; i++) {

    const target = document.getElementById("t" + i);

    target.addEventListener("targetFound", () => {
      playVideo(i);
    });

  }

}

/* =========================
   VIDEO PLAY
========================= */

function playVideo(i) {

  const vid = document.getElementById("video" + i);

  title.textContent = "Artwork " + (i + 1);

  videoPlayer.classList.add("active");

  video.src = vid.src;
  video.muted = false;

  video.play().catch(e => {
    console.log("Autoplay blocked:", e);
  });

}

/* =========================
   BACK
========================= */

async function backToScan() {

  video.pause();
  video.removeAttribute("src");

  videoPlayer.classList.remove("active");

  arWrapper.style.display = "block";

  if (mindarSystem) {
    await mindarSystem.start();
  }

}

/* =========================
   EXIT
========================= */

async function closeAR() {

  video.pause();
  video.removeAttribute("src");

  videoPlayer.classList.remove("active");

  arWrapper.style.display = "none";
  landing.style.display = "flex";

  if (mindarSystem) {
    await mindarSystem.stop();
  }

}

</script>

</body>
</html>
