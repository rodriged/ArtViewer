<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
/>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>

<title>ArtPlay AR Analytics</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- UPDATED MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Mono:wght@300;400&display=swap');

:root{
  --bg:#0e0e0e;
  --gold:#b8924a;
  --gold2:#d4ad72;
  --text:#f2ede4;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:black;
  color:var(--text);
  font-family:'DM Mono',monospace;
}

/* IMPORTANT:
   REMOVE fixed positioning
   REMOVE overflow hidden
*/

body{
  width:100%;
  height:100%;
}

/* KILL AFRAME UI */

.a-enter-vr,
.a-enter-vr-button,
.a-enter-ar,
.a-enter-ar-button,
.a-orientation-modal,
[aframe-injected],
.a-loader-title,
.a-dialog{
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* LANDING */

#landing{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2rem;
  background:#0e0e0e;
}

.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,10vw,5rem);
  letter-spacing:.15em;
  font-weight:300;
}

.logo span{
  color:var(--gold);
  font-style:italic;
}

.sub{
  margin-top:.6rem;
  margin-bottom:2rem;
  font-size:.7rem;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
}

#startBtn{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:1rem 2rem;
  font-size:.7rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  cursor:pointer;
}

#statusText{
  margin-top:1.5rem;
  max-width:320px;
  line-height:1.7;
  font-size:.7rem;
  color:rgba(255,255,255,.65);
}

/* AR */

#ar-wrapper{
  position:fixed;
  inset:0;
  display:none;
  background:black;
}

#arScene{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

/* HUD */

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  padding:1rem;
  display:flex;
  justify-content:space-between;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.7),
    transparent
  );
  pointer-events:none;
}

#hudTitle{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;
  color:var(--gold2);
}

#hudStatus{
  font-size:.6rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.7);
}

/* SCAN */

#scanBox{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:40;
  pointer-events:none;
}

.scanFrame{
  width:min(70vw,300px);
  height:min(70vw,300px);
  border:2px solid var(--gold);
}

/* VIDEO */

#videoPlayer{
  position:fixed;
  inset:0;
  z-index:200;
  background:black;
  display:none;
  align-items:center;
  justify-content:center;
}

#videoPlayer.active{
  display:flex;
}

#fullscreenVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;

  transform:translateZ(0);
  -webkit-transform:translateZ(0);

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

#videoTop{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:1rem;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.75),
    transparent
  );
}

#videoTitle{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;
}

#videoMeta{
  margin-top:.2rem;
  font-size:.65rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--gold);
}

#videoBottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:1rem;
  display:flex;
  justify-content:space-between;
  gap:1rem;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.75),
    transparent
  );
}

.btn{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:.8rem 1rem;
  font-size:.65rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  cursor:pointer;
}

/* DEBUG */

#debugLog{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:9999;
  background:rgba(0,0,0,.85);
  color:#0f0;
  font-size:11px;
  max-height:120px;
  overflow:auto;
  padding:4px;
}

</style>
</head>

<body>

<div id="debugLog"></div>

<!-- LANDING -->

<div id="landing">

  <div class="logo">
    Art<span>Play</span>
  </div>

  <div class="sub">
    Augmented Reality Gallery
  </div>

  <button id="startBtn">
    Enter Gallery
  </button>

  <div id="statusText">
    Ready
  </div>

</div>

<!-- AR -->

<div id="ar-wrapper">

  <div id="hud">

    <div id="hudTitle">
      ArtPlay
    </div>

    <div id="hudStatus">
      Scanning…
    </div>

  </div>

  <div id="scanBox">
    <div class="scanFrame"></div>
  </div>

  <a-scene
    id="arScene"
    embedded
    loading-screen="enabled:false"
    renderer="antialias:true; alpha:true;"
    vr-mode-ui="enabled:false"
    xr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"

    mindar-image="
      imageTargetSrc:https://rodriged.github.io/ArtViewer/targets.mind;
      autoStart:false;
      uiLoading:no;
      uiScanning:no;
      uiError:no;
      maxTrack:1;
      filterMinCF:0.0001;
      filterBeta:0.01;
    "
  >

    <a-assets timeout="10000">

      <!-- IMPORTANT:
           preload=none
           ONLY LOAD ONE VIDEO FIRST
      -->

      <video
        id="video0"
        src="https://rodriged.github.io/ArtViewer/Lion-a.mp4"
        preload="none"
        muted
        playsinline
        webkit-playsinline
        loop
      ></video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled:false"
    ></a-camera>

    <a-entity
      id="target0"
      mindar-image-target="targetIndex:0"
    ></a-entity>

  </a-scene>

</div>

<!-- VIDEO -->

<div id="videoPlayer">

  <video
    id="fullscreenVideo"
    playsinline
    webkit-playsinline
    muted
    loop
  ></video>

  <div id="videoTop">

    <div id="videoTitle"></div>

    <div id="videoMeta"></div>

  </div>

  <div id="videoBottom">

    <button
      class="btn"
      onclick="backToScan()"
    >
      Scan Another
    </button>

    <button
      class="btn"
      onclick="exitApp()"
    >
      Exit
    </button>

  </div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBLgVzIThthvr0fQJR9vF2PLozE7AlCJlw",
  authDomain: "artplayweb-e4839.firebaseapp.com",
  projectId: "artplayweb-e4839",
  storageBucket: "artplayweb-e4839.firebasestorage.app",
  messagingSenderId: "163947790614",
  appId: "1:163947790614:web:0e8bca2b7e1fe848d91037"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* ARTWORKS */

const artworks = [
  {
    title:"Artwork Lion",
    artist:"Sue Siva",
    year:"2026"
  }
];

/* DOM */

const landing       = document.getElementById("landing");
const arWrapper     = document.getElementById("ar-wrapper");
const arScene       = document.getElementById("arScene");

const statusText    = document.getElementById("statusText");
const hudStatus     = document.getElementById("hudStatus");

const videoPlayer   = document.getElementById("videoPlayer");
const fullscreenVid = document.getElementById("fullscreenVideo");

const videoTitle    = document.getElementById("videoTitle");
const videoMeta     = document.getElementById("videoMeta");

/* STATE */

let mindarSystem = null;
let started = false;

/* DEBUG */

function log(msg){

  console.log(msg);

  const d =
    document.getElementById("debugLog");

  d.innerHTML += msg + "<br>";

}

/* GLOBAL ERRORS */

window.addEventListener(
  "unhandledrejection",
  e => {
    log("UNHANDLED: " + e.reason);
  }
);

window.addEventListener(
  "error",
  e => {
    log("ERROR: " + e.message);
  }
);

/* EVENTS */

arScene.addEventListener(
  "arReady",
  () => {
    log("AR READY");
  }
);

arScene.addEventListener(
  "arError",
  e => {
    log("AR ERROR");
    console.error(e);
  }
);

/* START BUTTON */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startAR
  );

/* START AR */

async function startAR(){

  try{

    log("START");

    statusText.textContent =
      "Starting AR...";

    /* CAMERA PREWARM */

    log("PREWARM CAMERA");

    const video =
      document.createElement("video");

    video.setAttribute(
      "playsinline",
      true
    );

    video.setAttribute(
      "muted",
      true
    );

    video.setAttribute(
      "autoplay",
      true
    );

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:"environment",

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }
          },

          audio:false
        });

    video.srcObject = stream;

    await video.play();

    await new Promise(r =>
      setTimeout(r, 1000)
    );

    stream.getTracks()
      .forEach(t => t.stop());

    log("CAMERA READY");

    /* SHOW AR */

    landing.style.display =
      "none";

    arWrapper.style.display =
      "block";

    /* WAIT FOR RENDER */

    await new Promise(resolve => {

      requestAnimationFrame(() => {

        requestAnimationFrame(resolve);

      });

    });

    log("SCENE RENDERED");

    /* WAIT FOR MINDAR */

    await waitForMindAR();

    log(
      "SYSTEMS: " +
      Object.keys(arScene.systems)
        .join(", ")
    );

    AFRAME.scenes[0]
      .renderer
      .setPixelRatio(1);

    log("STARTING MINDAR");

    await arScene.systems[
      "mindar-image-system"
    ].start();

    started = true;

    log("MINDAR STARTED");

    attachListeners();

  } catch(err){

    console.error(err);

    log("FAILED: " + err.message);

    alert(
      "Failed to start AR:\n\n" +
      err.message
    );

    landing.style.display =
      "flex";

    arWrapper.style.display =
      "none";
  }
}

/* WAIT FOR SYSTEM */

function waitForMindAR(){

  return new Promise(
    (resolve,reject) => {

      const start = Date.now();

      const timer =
        setInterval(() => {

          const sys =
            arScene.systems[
              "mindar-image-system"
            ] ||
            arScene.systems[
              "mindar-image"
            ];

          if(sys){

            clearInterval(timer);

            mindarSystem = sys;

            log("MINDAR FOUND");

            resolve(sys);

          }

          if(
            Date.now() - start >
            10000
          ){

            clearInterval(timer);

            reject(
              new Error(
                "MindAR timeout"
              )
            );

          }

        },100);

    });
}

/* TARGET EVENTS */

function attachListeners(){

  const target =
    document.getElementById(
      "target0"
    );

  target.addEventListener(
    "targetFound",
    () => {

      log("TARGET FOUND");

      showVideo(0);

    }
  );
}

/* SHOW VIDEO */

async function showVideo(i){

  if(!started) return;

  const art = artworks[i];

  const src =
    document
      .getElementById("video0")
      .getAttribute("src");

  try{
    mindarSystem.pause();
  }catch(e){}

  arWrapper.style.display =
    "none";

  videoPlayer.classList.add(
    "active"
  );

  fullscreenVid.src = src;

  videoTitle.textContent =
    art.title;

  videoMeta.textContent =
    `${art.artist} · ${art.year}`;

  try{

    await fullscreenVid.play();

  }catch(e){

    log(
      "VIDEO PLAY FAIL"
    );

  }
}

/* BACK */

async function backToScan(){

  fullscreenVid.pause();

  fullscreenVid.src = "";

  videoPlayer.classList.remove(
    "active"
  );

  arWrapper.style.display =
    "block";

  try{

    mindarSystem.unpause();

  }catch(e){}
}

/* EXIT */

async function exitApp(){

  try{

    await mindarSystem.stop();

  }catch(e){}

  fullscreenVid.pause();

  fullscreenVid.src = "";

  videoPlayer.classList.remove(
    "active"
  );

  arWrapper.style.display =
    "none";

  landing.style.display =
    "flex";

  started = false;
}

log("APP LOADED");

</script>

</body>
</html>
