<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Enterprise AR Gallery</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: system-ui;
}

/* LANDING */
#landing {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}

/* AR */
#ar-wrapper {
  position: fixed;
  inset: 0;
  display: none;
}

#arScene {
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: 0.5s;
}

/* VIDEO */
#videoLayer {
  position: fixed;
  inset: 0;
  background: black;
  display: none;
  z-index: 9999;
}

#videoLayer.active {
  display: block;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* NAV CONTROLS (ENTERPRISE FEATURE) */
#navBar {
  position: absolute;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: space-around;
  z-index: 20;
}

button {
  padding: 12px 16px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid white;
}

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  z-index: 10;
}

</style>

</head>

<body>

<!-- LANDING -->
<div id="landing">
  <h1>Enterprise AR Gallery</h1>
  <button id="startBtn">Start System</button>
  <div id="status">Idle</div>
</div>

<!-- AR -->
<div id="ar-wrapper">

  <div id="hud">AR ACTIVE</div>

  <a-scene
    id="arScene"
    embedded
    vr-mode-ui="enabled:false"
    mindar-image="imageTargetSrc:https://rodriged.github.io/ArtViewer/targets.mind; autoStart:false;"
  >

    <a-assets>
      <video id="v0" src="https://rodriged.github.io/ArtViewer/Lion-a.mp4" loop playsinline></video>
      <video id="v1" src="https://rodriged.github.io/ArtViewer/FlamingPeacock.mp4" loop playsinline></video>
      <video id="v2" src="https://rodriged.github.io/ArtViewer/SS-SpanishDancer.mp4" loop playsinline></video>
      <video id="v3" src="https://rodriged.github.io/ArtViewer/IndianDancer.mp4" loop playsinline></video>
      <video id="v4" src="https://rodriged.github.io/ArtViewer/Hello-whale.mp4" loop playsinline></video>
    </a-assets>

    <a-camera></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex:2"></a-entity>
    <a-entity id="t3" mindar-image-target="targetIndex:3"></a-entity>
    <a-entity id="t4" mindar-image-target="targetIndex:4"></a-entity>

  </a-scene>

</div>

<!-- VIDEO PLAYER -->
<div id="videoLayer">

  <video id="player" playsinline controls></video>

  <!-- ENTERPRISE NAVIGATION SYSTEM -->
  <div id="navBar">

    <button onclick="prevArt()">⏮ Prev</button>
    <button onclick="nextArt()">⏭ Next</button>
    <button onclick="returnToAR()">↩ Back to AR</button>

  </div>

</div>

<script>

/* =========================
   ENTERPRISE STATE SYSTEM
========================= */

const state = {
  currentIndex: 0,
  total: 5,
  mindar: null,
  playing: false
};

/* =========================
   DOM
========================= */

const landing = document.getElementById("landing");
const arWrapper = document.getElementById("ar-wrapper");
const arScene = document.getElementById("arScene");
const videoLayer = document.getElementById("videoLayer");
const player = document.getElementById("player");
const status = document.getElementById("status");

/* =========================
   START SYSTEM
========================= */

document.getElementById("startBtn").onclick = async () => {

  landing.style.display = "none";
  arWrapper.style.display = "block";

  await waitScene();

  state.mindar = arScene.systems["mindar-image-system"];

  await state.mindar.start();

  arScene.style.opacity = "1";

  attachTargets();

  status.innerText = "System Ready";

};

/* =========================
   SCENE READY
========================= */

function waitScene() {
  return new Promise(res => {
    if (arScene.hasLoaded) return res();
    arScene.addEventListener("loaded", res);
  });
}

/* =========================
   TARGET HANDLER
========================= */

function attachTargets() {

  for (let i = 0; i < state.total; i++) {

    document.getElementById("t" + i)
      .addEventListener("targetFound", () => {
        playArt(i);
      });

  }

}

/* =========================
   PLAY ART
========================= */

async function playArt(i) {

  state.currentIndex = i;
  state.playing = true;

  await state.mindar.stop();

  arWrapper.style.display = "none";
  videoLayer.classList.add("active");

  const vid = document.getElementById("v" + i);

  player.src = vid.src;
  player.currentTime = 0;

  try {
    await player.play();
  } catch (e) {
    console.warn("Autoplay blocked");
  }

  player.onended = () => {
    nextArt(); // ENTERPRISE FEATURE: auto-next
  };

}

/* =========================
   NAVIGATION SYSTEM
========================= */

function nextArt() {

  let next = (state.currentIndex + 1) % state.total;
  switchArt(next);

}

function prevArt() {

  let prev = (state.currentIndex - 1 + state.total) % state.total;
  switchArt(prev);

}

async function switchArt(i) {

  state.currentIndex = i;

  player.pause();

  const vid = document.getElementById("v" + i);

  player.src = vid.src;
  player.currentTime = 0;

  await player.play();

}

/* =========================
   RETURN TO AR
========================= */

async function returnToAR() {

  player.pause();

  videoLayer.classList.remove("active");
  arWrapper.style.display = "block";

  await state.mindar.start();

  state.playing = false;

}

</script>

</body>
</html>
